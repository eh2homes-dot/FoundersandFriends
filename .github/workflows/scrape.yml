name: Scrape jobs

# GitHub runs this for you — no server, no database, no cron on your Mac.
# run.js writes site/jobs.json, beside site/index.html — the folder Cloudflare
# serves. Committing it triggers a rebuild.
on:
  schedule:
    # Daily at 07:00 UTC — 02:00 Eastern, 03:00 during daylight saving. Early
    # enough that the board is fresh before the working day starts.
    #
    # GitHub's scheduler is best-effort and can lag by several minutes under
    # load. It also disables cron on public repos after 60 days with no commits
    # — daily runs keep that clock reset as long as the feed keeps changing.
    #
    #        ┌─ minute
    #        │ ┌─ hour (UTC)
    #        │ │ ┌─ day of month
    #        │ │ │ ┌─ month
    #        │ │ │ │ ┌─ day of week
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      hub:
        description: 'Which hub to scrape'
        type: choice
        options: [both, opco, proptech]
        default: both
      urls:
        # Three modes rather than a boolean, because writing a careers_url is
        # the one change here that can quietly make things worse: a wrong URL
        # scrapes to zero roles and reads as "not hiring" rather than as a
        # failure. 'report' prints candidates and changes nothing. Read it,
        # then run again with 'write'.
        description: 'Find careers URLs for companies with no scrape method'
        type: choice
        # 'off' is quoted deliberately: YAML reads a bare off as boolean false,
        # which would arrive as "false" and never match the 'off' comparison in
        # the step condition below — so the step would run even when disabled.
        options: ['off', 'report', 'write']
        default: 'off'
      detect:
        description: 'Re-detect ATS for companies with no scrape method'
        type: boolean
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The only permission this needs: writing the feed back to the repo.
    permissions:
      contents: write

    steps:
      # v5 on both actions below. v4 declares Node 20 internally, which the
      # runners now force onto 24 and warn about on every run. The warning is
      # cosmetic today and a failure later; v5 is a drop-in for this usage.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # GitHub's runners force Node 24 now, and a workflow asking for 20
          # produces a deprecation warning on every run. run.js needs 18+ for
          # built-in fetch, so 24 is fine.
          node-version: '24'

      # No install step: run.js and the scripts/ helpers use only built-in Node
      # APIs (fetch, fs, URL). Nothing to install, nothing to break.

      # Runs before detection on purpose. A fixed careers_url is only useful
      # once its ATS is known, and detect-ats.js reads whatever this leaves in
      # config.js — so with both enabled, a company can go from dead URL to
      # working scrape in one run instead of two.
      - name: Find careers URLs
        if: inputs.urls != 'off' && inputs.urls != ''
        run: |
          FLAGS=""
          if [ "${{ inputs.urls }}" = "write" ]; then FLAGS="--write"; fi
          if [ "${{ inputs.hub }}" != "both" ] && [ -n "${{ inputs.hub }}" ]; then
            FLAGS="$FLAGS --hub=${{ inputs.hub }}"
          fi
          echo "running: node scripts/find-careers-url.js $FLAGS"
          node scripts/find-careers-url.js $FLAGS

      - name: Detect ATS for new companies
        if: inputs.detect
        run: node scripts/detect-ats.js

      # A single pass over every company when no hub is chosen. run.js merges
      # correctly either way — a hub run now leaves the other hub's roles
      # untouched — but one invocation is simpler and half the requests.
      - name: Scrape both hubs
        if: inputs.hub == '' || inputs.hub == 'both'
        env:
          HISTORY_URL: ${{ secrets.HISTORY_URL }}
          HISTORY_KEY: ${{ secrets.HISTORY_KEY }}
        run: node run.js --out=site/jobs.json

      - name: Scrape one hub
        if: inputs.hub == 'opco' || inputs.hub == 'proptech'
        env:
          HISTORY_URL: ${{ secrets.HISTORY_URL }}
          HISTORY_KEY: ${{ secrets.HISTORY_KEY }}
        run: node run.js --hub=${{ inputs.hub }} --out=site/jobs.json

      # Guard against publishing a broken or empty feed. A scrape that fails
      # halfway should leave yesterday's feed in place, not replace it with
      # nothing — the site would show "no roles" and look shut down.
      - name: Validate the feed before committing
        run: |
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('site/jobs.json', 'utf8');
            const data = JSON.parse(raw);
            const jobs = Array.isArray(data) ? data : data.jobs;
            if (!Array.isArray(jobs)) throw new Error('feed is not an array of jobs');
            if (jobs.length === 0) throw new Error('feed is empty — refusing to publish');
            const bad = jobs.filter(j => !j.id || !j.title || !j.company);
            if (bad.length) throw new Error(bad.length + ' rows missing id, title or company');
            console.log('feed ok: ' + jobs.length + ' jobs');
          "
      - name: Commit the feed (and any config.js changes)
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add site/jobs.json config.js
          if git diff --staged --quiet; then
            echo "No change since the last scrape — nothing to commit."
            exit 0
          fi
          COUNT=$(node -e "const d=require('./site/jobs.json');console.log((d.jobs||d).length)")
          git commit -m "Update job feed: $COUNT roles"

          # A scrape takes 30-60 seconds. Anything committed to main in that
          # window — a file edited in the GitHub web editor, say — leaves this
          # runner's checkout stale and the push is rejected, throwing away a
          # scrape that already succeeded.
          #
          # Rebase and retry. site/jobs.json is generated and owned solely by
          # this job, so replaying that one commit onto newer work cannot
          # conflict with anything a human edited by hand.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected — rebasing onto origin/main (attempt $attempt of 3)"
            git pull --rebase origin main || {
              echo "rebase failed; leaving main untouched. Re-run this workflow."
              exit 1
            }
            sleep 2
          done

          echo "push still rejected after 3 attempts — re-run this workflow."
          exit 1
      - name: Report
        if: always()
        run: |
          echo "### Scrape run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Finished: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f site/jobs.json ]; then
            echo "- Roles in feed: $(node -e "const d=require('./site/jobs.json');console.log((d.jobs||d).length)")" >> $GITHUB_STEP_SUMMARY
          fi
