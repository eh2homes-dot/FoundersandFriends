<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Command Center — Founders &amp; Friends</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   Command Center — the applicant pipeline.
   Same palette as the board, but denser: this is a working tool, not a shop
   window. Nothing here is public — the page is noindex and every request needs
   the admin key.
   ========================================================================== */
:root{
  --void:#07040F; --panel:#0E0820; --panel-2:#140C2B;
  --line:rgba(200,197,218,.10); --line-2:rgba(200,197,218,.18);
  --ink:#F4F3FA; --ink-soft:#CFC9E4; --ink-dim:#9D95BD;
  --green:#00FF88; --purple:#7F4DE0; --purple-text:#A98FEC;
  --cyan:#3BE8FF; --pink:#FF4D9D; --amber:#F0B429; --red:#FF6B6B;
  --head:'EB Garamond',Garamond,'Apple Garamond',Georgia,serif;
  --body:'EB Garamond',Garamond,'Apple Garamond',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}

/* The hidden attribute works through display:none in the browser's default
   stylesheet, and ANY author display rule outranks it — .gate below sets
   display:grid, so `gate.hidden = true` had no visual effect at all. The gate
   stayed on screen through every successful sign-in, which looked exactly like
   a button that did nothing. */
[hidden]{display:none !important}
body{
  background:
    radial-gradient(1100px 620px at 82% -8%, rgba(127,77,224,.20), transparent 62%),
    radial-gradient(900px 520px at 4% 104%, rgba(0,255,136,.07), transparent 60%),
    var(--void);
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1400px;margin:0 auto;padding:38px 30px 90px}

/* ---------- sign in ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{
  width:100%;max-width:420px;padding:38px 34px;border-radius:20px;
  background:linear-gradient(150deg,rgba(43,16,85,.5),rgba(11,6,24,.9));
  border:1px solid var(--line-2);box-shadow:0 30px 70px rgba(4,2,10,.6);
}
.gate h1{font-family:var(--head);font-size:26px;margin-bottom:8px}
.gate p{color:var(--ink-dim);font-size:14px;line-height:1.6;margin-bottom:22px}
.gate input{
  width:100%;padding:14px 16px;border-radius:11px;margin-bottom:14px;
  background:rgba(7,4,15,.7);border:1px solid var(--line-2);color:var(--ink);
  font-family:var(--mono);font-size:14px;
}
.gate input:focus{outline:none;border-color:var(--purple)}
.gate button{
  width:100%;padding:14px;border-radius:11px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--purple),#5A2FA8);color:#fff;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
}
.gate .err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}

/* ---------- header ---------- */
.eyebrow{
  display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--purple-text);margin-bottom:10px;
}
.eyebrow::before{content:"";width:9px;height:9px;background:var(--purple);transform:rotate(45deg)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:34px}
h1.title{
  font-family:var(--head);font-size:clamp(34px,5vw,54px);font-weight:700;
  letter-spacing:.01em;line-height:1.05;text-transform:uppercase;
  background:linear-gradient(96deg,#F4F3FA 8%,var(--purple-text) 52%,var(--cyan) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.btn{
  padding:11px 20px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line-2);background:rgba(20,12,43,.7);color:var(--ink-soft);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  transition:border-color .2s,color .2s,transform .15s;
}
.btn:hover{border-color:var(--purple);color:var(--ink);transform:translateY(-1px)}

/* ---------- stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:26px}
.stat{
  padding:22px 24px;border-radius:16px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(43,16,85,.42),rgba(11,6,24,.88));
  border:1px solid var(--line);transition:border-color .25s,transform .25s;
}
.stat:hover{transform:translateY(-2px)}
.stat[data-tone="total"]{--tone:var(--purple-text)}
.stat[data-tone="new"]{--tone:var(--green)}
.stat[data-tone="interview"]{--tone:var(--cyan)}
.stat[data-tone="offer"]{--tone:var(--pink)}
.stat::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;background:var(--tone);opacity:.6}
.stat-k{
  display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:14px;
}
.stat-k svg{width:15px;height:15px;color:var(--tone)}
.stat-v{font-family:var(--head);font-size:40px;font-weight:700;line-height:1;color:var(--tone)}
.stat-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-dim);margin-top:8px}

/* ---------- filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{
  padding:9px 16px;border-radius:100px;cursor:pointer;
  border:1px solid var(--line);background:rgba(20,12,43,.6);color:var(--ink-dim);
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  transition:all .2s;
}
.chip:hover{color:var(--ink-soft);border-color:var(--line-2)}
.chip.on{background:rgba(127,77,224,.2);border-color:var(--purple);color:var(--ink)}

/* ---------- table ---------- */
.panel{
  border-radius:18px;overflow:hidden;
  background:linear-gradient(160deg,rgba(20,12,43,.7),rgba(11,6,24,.9));
  border:1px solid var(--line);
}
.panel-head{
  padding:20px 26px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.panel-head h2{font-family:var(--head);font-size:19px;font-weight:600}
.count{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-dim)}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;padding:13px 18px;
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-dim);border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:15px 18px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr.row{cursor:pointer;transition:background .18s}
tr.row:hover{background:rgba(127,77,224,.09)}
.who b{display:block;font-weight:600}
.who span{display:block;font-size:12px;color:var(--ink-dim);margin-top:2px}
.role b{display:block;font-weight:500;font-size:13.5px}
.role span{display:block;font-size:12px;color:var(--ink-dim);margin-top:2px}
.ref{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.score{
  font-family:var(--mono);font-size:13px;font-weight:500;
  display:inline-grid;place-items:center;width:44px;height:32px;border-radius:9px;
  border:1px solid currentColor;
}
.score.hi{color:var(--green)} .score.mid{color:var(--amber)} .score.lo{color:var(--ink-dim)}
.pill{
  font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  padding:5px 11px;border-radius:100px;border:1px solid currentColor;white-space:nowrap;
}
.pill.new{color:var(--green)} .pill.reviewing{color:var(--cyan)}
.pill.interview{color:var(--purple-text)} .pill.offer{color:var(--pink)}
.pill.hired{color:var(--green)} .pill.passed{color:var(--ink-dim)}
.sent{font-size:15px}
.sent.ok{color:var(--green)} .sent.no{color:var(--red)}
.empty{padding:74px 20px;text-align:center;color:var(--ink-dim);font-size:14.5px}

/* ---------- signals ---------- */
.sig-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:20px}
.sig-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
.sig-card{
  border-radius:18px;padding:26px 30px;margin-bottom:18px;
  background:linear-gradient(160deg,rgba(20,12,43,.7),rgba(11,6,24,.9));
  border:1px solid var(--line);
}
.sig-card h3{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-dim);font-weight:400;margin-bottom:6px;
}
.sig-card .sig-sub{font-size:13.5px;color:var(--ink-dim);line-height:1.6;margin-bottom:18px}
.sig-row{
  display:flex;align-items:baseline;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.sig-row:last-child{border-bottom:0}
.sig-role{font-size:15px;font-weight:600;color:var(--ink)}
.sig-co{font-size:14px;color:var(--ink-soft)}
.sig-meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-left:auto;white-space:nowrap}
.sig-tag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:100px;border:1px solid currentColor;
}
.sig-tag.first{color:var(--green)}
.sig-tag.pay{color:var(--cyan)}
.sig-big{font-family:var(--head);font-size:34px;font-weight:700;color:var(--purple-text);line-height:1}
.sig-warn{
  padding:14px 18px;border-radius:12px;margin-bottom:18px;
  background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.3);
  font-size:13.5px;line-height:1.6;color:var(--amber);
}
.sig-empty{padding:40px 0;text-align:center;color:var(--ink-dim);font-size:14px}

/* ---------- detail drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,2,10,.72);backdrop-filter:blur(4px);z-index:60}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);z-index:61;
  background:linear-gradient(160deg,#160C30,#0B0618);border-left:1px solid var(--line-2);
  display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(4,2,10,.6);
}
.dr-top{padding:26px 30px;border-bottom:1px solid var(--line);position:relative}
.dr-top h3{font-family:var(--head);font-size:25px;font-weight:700;margin-bottom:5px}
.dr-top p{color:var(--ink-dim);font-size:14px}
.dr-close{
  position:absolute;top:22px;right:24px;width:34px;height:34px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line-2);background:rgba(7,4,15,.6);color:var(--ink-soft);font-size:15px;
}
.dr-body{padding:26px 30px;overflow-y:auto;flex:1}
.dr-sec{margin-bottom:26px}
.dr-sec h4{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:11px;
}
.dr-sec p,.dr-sec li{font-size:14.5px;line-height:1.68;color:var(--ink-soft)}
.dr-sec ul{padding-left:19px}
.dr-sec li{margin-bottom:7px}
.bg-text{white-space:pre-wrap;border-left:2px solid var(--line-2);padding-left:15px}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin-bottom:26px}
.dr-fact{background:var(--panel);padding:15px 18px}
.dr-fact dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:5px}
.dr-fact dd{font-size:14px;font-weight:500}
.dr-foot{padding:20px 30px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
.dr-send{padding:18px 30px 24px;border-top:1px solid var(--line);background:rgba(127,77,224,.06)}
.dr-decline{padding:18px 30px 24px;border-top:1px solid var(--line);background:rgba(255,107,107,.05)}
.dr-decline h4{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:11px;
}
.dr-decline textarea{min-height:58px;margin-bottom:11px}
.dl-check{
  display:flex;align-items:center;gap:9px;margin-bottom:13px;
  font-size:13px;color:var(--ink-soft);cursor:pointer;
}
.dl-check input{width:15px;height:15px;accent-color:var(--purple);cursor:pointer}
.send-note{font-size:12.5px;line-height:1.6;color:var(--ink-dim);margin-bottom:14px}
.send-note b{color:var(--ink-soft)}
.send-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.btn.send{border-color:var(--purple);color:var(--ink)}
.btn.send.danger{border-color:rgba(255,107,107,.5);color:var(--red)}
.btn.send.danger:hover{border-color:var(--red);background:rgba(255,107,107,.1)}
.send-warn{color:var(--amber);display:block;margin-top:6px;font-size:12px}
.send-status{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-dim)}
.dr-foot .btn.act{border-color:var(--purple);color:var(--ink)}
textarea{
  width:100%;min-height:90px;padding:13px 15px;border-radius:11px;resize:vertical;
  background:rgba(7,4,15,.6);border:1px solid var(--line-2);color:var(--ink);
  font-family:var(--body);font-size:14px;line-height:1.6;
}
textarea:focus{outline:none;border-color:var(--purple)}
@media(max-width:760px){
  .dr-grid{grid-template-columns:1fr}
  th.hide,td.hide{display:none}
}
</style>
</head>
<body>

<!-- Sign in. The key is exchanged for an HttpOnly cookie rather than living in
     the URL: this page shows names, emails and career histories, and a ?key= in
     the address bar leaks into history, bookmarks and referer headers. -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h1>Command Center</h1>
    <p>Enter your admin key to see the applicant pipeline.</p>
    <input type="password" id="key" placeholder="Admin key" autocomplete="current-password" />
    <button type="button" id="signin">Sign in</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <div>
      <div class="eyebrow">Command Center</div>
      <h1 class="title" id="title">Pipeline</h1>
    </div>
    <div style="display:flex;gap:9px">
      <button class="btn" type="button" data-view="pipeline">Pipeline</button>
      <button class="btn" type="button" data-view="signals">Signals</button>
      <button class="btn" type="button" data-view="coverage">Coverage</button>
      <button class="btn" type="button" id="refresh">Refresh</button>
      <button class="btn" type="button" id="signout">Sign out</button>
      <a class="btn" href="/">← Board</a>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters"></div>

  <!-- Signals: what changed on the board. Hidden until asked for. -->
  <div id="signals-view" hidden>
    <div class="sig-controls">
      <span class="sig-label">Window</span>
      <button class="chip" type="button" data-sigdays="7">7 days</button>
      <button class="chip on" type="button" data-sigdays="14">14 days</button>
      <button class="chip" type="button" data-sigdays="30">30 days</button>
      <span class="sig-label" style="margin-left:16px">Hub</span>
      <button class="chip on" type="button" data-sighub="all">All</button>
      <button class="chip" type="button" data-sighub="opco">OpCo</button>
      <button class="chip" type="button" data-sighub="proptech">PropTech</button>
      <button class="btn act" type="button" id="sig-copy" style="margin-left:auto">Copy as text</button>
    </div>
    <div id="signals-body"><div class="empty">Loading…</div></div>
  </div>

  <!-- Coverage: the state of the scraper. Operational detail, admin only. -->
  <div id="coverage-view" hidden>
    <div id="coverage-body"><div class="empty">Loading…</div></div>
  </div>

  <div class="panel" id="pipeline-view">
    <div class="panel-head">
      <h2>All Applicants</h2>
      <span class="count" id="count"></span>
    </div>
    <div id="table-wrap"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ALL = [], COUNTS = {}, filterHub = 'all', filterStatus = 'all', openRef = null;

/* The admin key, held in memory for this tab only. Sent as a header on every
   request rather than relying on a cookie: a cookie can be blocked or dropped
   by the browser with no visible error, which is impossible to diagnose from
   the outside. sessionStorage keeps a refresh from logging you out, and is
   cleared when the tab closes. */
/* The key is remembered for this tab, but not indefinitely: this page shows
   names, emails and career histories, and an unattended laptop should not leave
   them open. After IDLE_MINUTES without a request the key is dropped and the
   gate returns. */
const IDLE_MINUTES = 60;

let ADMIN_KEY = '';
try {
  const saved = sessionStorage.getItem('ff_admin_key');
  const at = Number(sessionStorage.getItem('ff_admin_at') || 0);
  if (saved && at && (Date.now() - at) < IDLE_MINUTES * 60000) ADMIN_KEY = saved;
  else sessionStorage.removeItem('ff_admin_key');
} catch (_) { /* storage blocked */ }

/** Called on every authenticated request, so the hour counts from last use. */
function touchSession() {
  try { sessionStorage.setItem('ff_admin_at', String(Date.now())); } catch (_) {}
}

/** Drops the key and returns to the gate. */
function signOut(message) {
  ADMIN_KEY = '';
  try { sessionStorage.removeItem('ff_admin_key'); sessionStorage.removeItem('ff_admin_at'); } catch (_) {}
  $('app').hidden = true;
  $('gate').hidden = false;
  $('key').value = '';
  if (message) $('gate-err').textContent = message;
}
const authHeaders = () => (ADMIN_KEY ? { 'X-Admin-Key': ADMIN_KEY } : {});

/* What each stored status is called on screen. 'passed' is the value in the
   database; "Declined" is what it means. */
const STATUS_LABEL = {
  new: 'New', reviewing: 'Reviewing', interview: 'Interview',
  offer: 'Offer', hired: 'Hired', passed: 'Declined',
};

const ICONS = {
  total: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h12"/></svg>',
  new: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  interview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  offer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ago = (iso) => {
  const then = Date.parse((iso || '').replace(' ', 'T') + 'Z');
  if (Number.isNaN(then)) return '';
  const mins = Math.floor((Date.now() - then) / 60000);
  if (mins < 60) return mins + 'm ago';
  const h = Math.floor(mins / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  return d < 30 ? d + 'd ago' : Math.floor(d / 30) + 'mo ago';
};

/* ---------- sign in ---------- */
async function signIn() {
  // The whole body is wrapped: any throw at all — a parse failure, blocked
  // sessionStorage, a render bug — becomes a visible message instead of
  // leaving the button stuck on "Checking…" with nothing to see.
  try {
    const key = $('key').value.trim();
    if (!key) { $('gate-err').textContent = 'Enter your key.'; return; }

    $('gate-err').textContent = 'Checking…';
    ADMIN_KEY = key;

    // One request. If the key is right this returns the applications directly,
    // so there is no separate login step to go wrong.
    const res = await fetch('/api/applications', { headers: { 'X-Admin-Key': key } });

    touchSession();

  if (res.status === 401) {
      ADMIN_KEY = '';
      $('gate-err').textContent = 'That key was not accepted.';
      return;
    }

    // Read as text first. If the API route is missing, Cloudflare's fallback
    // answers with index.html and a 200 — calling res.json() on that throws.
    const raw = await res.text();
    let body = null;
    try { body = JSON.parse(raw); } catch (_) { /* not JSON */ }

    if (body === null) {
      ADMIN_KEY = '';
      $('gate-err').textContent = raw.trim().startsWith('<')
        ? 'The API returned a page instead of data — worker.js may not be deployed.'
        : 'The server sent something unexpected (' + res.status + ').';
      return;
    }

    if (!res.ok) {
      $('gate-err').textContent = body.error || ('Server returned ' + res.status);
      return;
    }

    // Storage is a nicety, not a requirement — some browsers block it.
    try { sessionStorage.setItem('ff_admin_key', key); } catch (_) {}
    touchSession();

    ALL = body.applications || [];
    COUNTS = body.counts || {};
    $('gate-err').textContent = '';
    $('gate').hidden = true;
    $('app').hidden = false;
    render();

  } catch (err) {
    console.error('[admin] sign-in failed:', err);

  }
}

/* ---------- data ---------- */
/** Returns null on success, or a sentence explaining what went wrong. */
async function load() {
  let res;
  try {
    res = await fetch('/api/applications', { headers: authHeaders() });
  } catch (err) {
    return 'Could not reach the server. Check your connection and try again.';
  }

  if (res.status === 401) {
    // The cookie did not come back. Almost always a browser blocking cookies,
    // or the site being served over http where a Secure cookie is dropped.
    $('app').hidden = true; $('gate').hidden = false;
    return 'Your session expired. Sign in again.';
  }

  // Same defensive parse as signIn: if the API route is missing, the SPA
  // fallback answers with index.html and a 200, and res.json() would throw.
  const raw = await res.text();
  let body = null;
  try { body = JSON.parse(raw); } catch (_) { /* not JSON */ }
  if (body === null) {
    const msg = raw.trim().startsWith('<')
      ? 'The API returned a page instead of data — worker.js may not be deployed.'
      : 'The server sent something unexpected.';
    $('table-wrap').innerHTML = '<div class="empty">' + esc(msg) + '</div>';
    return msg;
  }

  if (!res.ok) {
    const msg = body.error || ('Server returned ' + res.status);
    $('table-wrap').innerHTML = '<div class="empty">' + esc(msg) + '</div>';
    return msg;
  }

  ALL = body.applications || [];
  COUNTS = body.counts || {};
  render();
  return null;
}
$('refresh').addEventListener('click', () => load());
$('signout').addEventListener('click', () => signOut('Signed out.'));

let covData = null;

async function loadCoverage() {
  $('coverage-body').innerHTML = '<div class="sig-empty">Loading…</div>';
  try {
    const res = await fetch('/api/coverage', { headers: authHeaders() });
    const raw = await res.text();
    let body = null;
    try { body = JSON.parse(raw); } catch (_) {}
    if (!body) {
      $('coverage-body').innerHTML = '<div class="sig-empty">' +
        (raw.trim().startsWith('<') ? 'The API returned a page — worker.js may not be deployed.'
                                    : 'The server sent something unexpected.') + '</div>';
      return;
    }
    if (!res.ok) { $('coverage-body').innerHTML = '<div class="sig-empty">' + esc(body.error || res.status) + '</div>'; return; }
    covData = body;
    renderCoverage(body);
  } catch (err) {
    $('coverage-body').innerHTML = '<div class="sig-empty">Could not load: ' + esc(err.message) + '</div>';
  }
}

function renderCoverage(d) {
  const out = [];
  const failed = d.sources_failed ?? 0;

  out.push(`<div class="stats">
    <div class="stat" data-tone="total"><div class="stat-k">Roles</div><div class="stat-v">${d.total_roles}</div><div class="stat-sub">in the feed</div></div>
    <div class="stat" data-tone="new"><div class="stat-k">Pulling</div><div class="stat-v">${d.pulling.length}</div><div class="stat-sub">companies contributing</div></div>
    <div class="stat" data-tone="interview"><div class="stat-k">Failing</div><div class="stat-v">${failed}</div><div class="stat-sub">sources errored</div></div>
    <div class="stat" data-tone="offer"><div class="stat-k">Quiet</div><div class="stat-v">${d.went_quiet.length}</div><div class="stat-sub">seen before, not now</div></div>
  </div>`);

  if (d.generated_at) {
    const age = Math.floor((Date.now() - new Date(d.generated_at).getTime()) / 3600000);
    out.push(`<div class="${age > 36 ? 'sig-warn' : 'sig-card'}" style="${age > 36 ? '' : 'padding:14px 18px'}">
      Feed generated ${age < 1 ? 'less than an hour' : age + ' hour' + (age === 1 ? '' : 's')} ago.
      ${age > 36 ? ' The daily scrape may have stopped — check Actions.' : ''}</div>`);
  }

  // ---- pulling ----
  out.push('<div class="sig-card"><h3>Pulling now</h3>');
  out.push('<p class="sig-sub">Companies contributing roles to the live feed, and which adapter reads them.</p>');
  d.pulling.forEach((c) => {
    out.push(`<div class="sig-row">
      <span class="sig-role">${esc(c.company)}</span>
      <span class="sig-tag ${c.hub === 'opco' ? 'first' : 'pay'}">${c.hub === 'opco' ? 'operator' : 'tech'}</span>
      <span class="sig-co">${esc(c.sources.join(', '))}</span>
      <span class="sig-meta">${c.roles} role${c.roles === 1 ? '' : 's'}</span>
    </div>`);
  });
  out.push('</div>');

  // ---- gone quiet ----
  if (d.went_quiet.length) {
    out.push('<div class="sig-card"><h3>Went quiet</h3>');
    out.push('<p class="sig-sub">These contributed before and are absent now — either they stopped hiring, or their board broke. Worth checking the ones that went quiet recently.</p>');
    d.went_quiet.forEach((c) => {
      out.push(`<div class="sig-row">
        <span class="sig-role">${esc(c.company)}</span>
        <span class="sig-co">${c.roles_ever} role${c.roles_ever === 1 ? '' : 's'} historically</span>
        <span class="sig-meta">${c.days_quiet != null ? c.days_quiet + ' day' + (c.days_quiet === 1 ? '' : 's') + ' quiet' : ''}</span>
      </div>`);
    });
    out.push('</div>');
  }

  // ---- runs ----
  if (d.recent_runs.length) {
    out.push('<div class="sig-card"><h3>Recent scrapes</h3>');
    out.push('<p class="sig-sub">A run flagged unreliable closed nothing, so the numbers stayed honest rather than recording a hiring freeze that never happened.</p>');
    d.recent_runs.forEach((r) => {
      out.push(`<div class="sig-row">
        <span class="sig-role">${esc(r.day)}</span>
        <span class="sig-co">${r.total_roles} role${r.total_roles === 1 ? '' : 's'}${r.sources_failed ? ` · ${r.sources_failed} source${r.sources_failed === 1 ? '' : 's'} failed` : ''}</span>
        ${r.ok === 0 ? '<span class="sig-tag" style="color:var(--amber)">unreliable</span>' : ''}
        <span class="sig-meta">${r.new_roles ?? 0} new · ${r.closed_roles ?? 0} closed</span>
      </div>`);
    });
    out.push('</div>');
  } else {
    out.push('<div class="sig-card"><h3>Recent scrapes</h3><div class="sig-empty">No scrape history yet. Run db/history-d1.sql and add the two GitHub secrets.</div></div>');
  }

  $('coverage-body').innerHTML = out.join('');
}

document.addEventListener('click', (e) => {

async function loadSignals() {
  $('signals-body').innerHTML = '<div class="sig-empty">Loading…</div>';
  try {
    const res = await fetch(`/api/signals?days=${sigDays}&hub=${sigHub}`, { headers: authHeaders() });
    const raw = await res.text();

                                    : 'The server sent something unexpected.') + '</div>';

const money = (r) => {
  if (!r.comp_min) return '';
  const k = (n) => '$' + Math.round(n / 1000) + 'k';
  return r.comp_min === r.comp_max ? k(r.comp_min) : k(r.comp_min) + '–' + k(r.comp_max);
};

function renderSignals(d) {
  const out = [];

  // Say plainly when the record cannot be trusted, rather than presenting
  // numbers built on missing days.
  if (d.trust && !d.trust.reliable) {
    out.push('<div class="sig-warn">' + (d.trust.no_history || d.trust.runs === 0
      ? 'No scrape history yet. New roles below are accurate; movement needs a couple of weeks of daily scrapes before it means anything.'
      : `The scrape record has ${d.trust.missing_days} missing day${d.trust.missing_days === 1 ? '' : 's'}` +
        (d.trust.unreliable_runs ? ` and ${d.trust.unreliable_runs} run${d.trust.unreliable_runs === 1 ? '' : 's'} flagged unreliable` : '') +
        '. Treat movement below as indicative rather than exact.') + '</div>');
  }

  // ---- new roles ----
  out.push('<div class="sig-card"><h3>New on the board</h3>');
  if (d.new_roles?.length) {
    out.push(`<p class="sig-sub">${d.total_new} role${d.total_new === 1 ? '' : 's'} went up in the last ${d.window_days} days. These ${d.new_roles.length} are worth a look — ranked by seniority, pay disclosure, and whether the company is new here. Any one company is capped at two.</p>`);
    d.new_roles.forEach((r) => {
      out.push(`<div class="sig-row">
        <span class="sig-role">${esc(r.title)}</span>
        <span class="sig-co">${esc(r.company)}</span>
        ${r.first_time ? '<span class="sig-tag first">first time</span>' : ''}
        ${r.comp_min ? `<span class="sig-tag pay">${money(r)}</span>` : ''}
        <span class="sig-meta">${esc(r.location || '')}</span>
      </div>`);
    });
  } else {
    out.push('<div class="sig-empty">Nothing new in this window.</div>');
  }
  out.push('</div>');

  // ---- filled ----
  if (d.filled?.length) {
    out.push('<div class="sig-card"><h3>Roles that were filled</h3>');
    out.push('<p class="sig-sub">These senior roles left the board, which means someone was hired. It does not say who.</p>');
    d.filled.slice(0, 12).forEach((r) => {
      out.push(`<div class="sig-row">
        <span class="sig-role">${esc(r.title)}</span>
        <span class="sig-co">${esc(r.company)}</span>
        <span class="sig-meta">${Number.isFinite(r.days_open) ? 'open ' + r.days_open + ' day' + (r.days_open === 1 ? '' : 's') : ''}</span>
      </div>`);
    });
    if (d.median_days_to_fill != null) {
      out.push(`<div style="margin-top:20px"><span class="sig-big">${d.median_days_to_fill}</span>
        <span class="sig-sub" style="margin-left:10px">median days to fill a senior role</span></div>`);
    }
    out.push('</div>');
  }

  // ---- opened ----
  if (d.opened?.length) {
    out.push('<div class="sig-card"><h3>Senior seats that just opened</h3>');
    out.push('<p class="sig-sub">Usually means someone left, or the team is growing.</p>');
    d.opened.slice(0, 12).forEach((r) => {
      out.push(`<div class="sig-row">
        <span class="sig-role">${esc(r.title)}</span>
        <span class="sig-co">${esc(r.company)}</span>
        <span class="sig-meta">${esc(r.location || '')}</span>
      </div>`);
    });
    out.push('</div>');
  }

  // ---- clusters: the actual market signal ----
  if (d.clusters?.length) {
    out.push('<div class="sig-card"><h3>Where the market is moving</h3>');
    out.push('<p class="sig-sub">The same role opening at several companies at once says more than any single posting.</p>');
    d.clusters.forEach((c) => {
      out.push(`<div class="sig-row">
        <span class="sig-role">${esc(c.title)}</span>
        <span class="sig-meta">${esc(c.companies.join(' · '))}</span>
      </div>`);
    });
    out.push('</div>');
  }

  $('signals-body').innerHTML = out.join('');
}

/** Plain text, for pasting wherever you want it. */
$('sig-copy').addEventListener('click', async () => {
  if (!sigData) return;
  const d = sigData, L = [];
  L.push(`SIGNALS — LAST ${d.window_days} DAYS`, '');
  if (d.new_roles?.length) {
    L.push('NEW ON THE BOARD');
    d.new_roles.forEach((r) => L.push(`  ${r.title} — ${r.company}` +
      (r.location ? ` · ${r.location}` : '') + (r.comp_min ? ` · ${money(r)}` : '') +
      (r.first_time ? ' (first time)' : '')));
    L.push('');
  }
  if (d.filled?.length) {
    L.push('FILLED');
    d.filled.forEach((r) => L.push(`  ${r.title} — ${r.company}` +
      (Number.isFinite(r.days_open) ? ` (open ${r.days_open} days)` : '')));
    L.push('');
  }
  if (d.opened?.length) {
    L.push('JUST OPENED');
    d.opened.forEach((r) => L.push(`  ${r.title} — ${r.company}`));
    L.push('');
  }
  if (d.clusters?.length) {
    L.push('MARKET MOVEMENT');
    d.clusters.forEach((c) => L.push(`  ${c.title} — ${c.companies.join(', ')}`));
  }
  const text = L.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    $('sig-copy').textContent = 'Copied';
    setTimeout(() => { $('sig-copy').textContent = 'Copy as text'; }, 1800);
  } catch (_) {
    // Clipboard can be blocked; show the text so it can still be selected.
    $('signals-body').insertAdjacentHTML('afterbegin',
      '<div class="sig-card"><h3>Copy this</h3><pre style="white-space:pre-wrap;font-size:12.5px;color:var(--ink-soft)">' +
      esc(text) + '</pre></div>');
  }
});

/* ---------- render ---------- */
function visible() {
  return ALL.filter((a) =>
    (filterHub === 'all' || a.hub === filterHub) &&
    (filterStatus === 'all' || a.status === filterStatus));
}

function render() {
  try { renderInner(); }
  catch (err) {
    console.error('[admin] render failed:', err);
    $('table-wrap').innerHTML = '<div class="empty">Could not draw the table: ' + esc(err.message) + '</div>';
  }
}

function renderInner() {
  const n = (s) => ALL.filter((a) => a.status === s).length;
  $('title').textContent = filterHub === 'proptech' ? 'PropTech Pipeline'
                        : filterHub === 'opco' ? 'OpCo Pipeline' : 'Pipeline';

  $('stats').innerHTML = [
    ['total', 'Total', ALL.length, 'all time'],
    ['new', 'New', n('new'), 'awaiting review'],
    ['interview', 'Interview', n('interview'), 'in process'],
    ['offer', 'Offers', n('offer') + n('hired'), n('hired') + ' hired'],
  ].map(([tone, label, value, sub]) => `
    <div class="stat" data-tone="${tone}">
      <div class="stat-k">${ICONS[tone]}${label}</div>
      <div class="stat-v">${value}</div>
      <div class="stat-sub">${esc(sub)}</div>

  $('filters').innerHTML = [
    ['hub', 'all', 'All hubs'], ['hub', 'opco', 'OpCo'], ['hub', 'proptech', 'PropTech'],

    ['status', 'interview', 'Interview'], ['status', 'offer', 'Offer'],
    ['status', 'hired', 'Hired'], ['status', 'passed', 'Declined'],
  ].map(([kind, val, label]) => {

    return `<button class="chip${on ? ' on' : ''}" data-kind="${kind}" data-val="${val}">${label}</button>`;
  }).join('');

        Email ${esc(a.first_name || 'the candidate')} to let them know
      </label>
      <div class="send-row">
        <button class="btn danger" type="button" id="decline-btn">Decline application</button>
      </div>
      <div class="send-status" id="decline-status">${a.status === 'passed'
        ? (a.declined_at ? 'Declined ' + esc(ago(a.declined_at)) : 'Marked passed')
        : ''}</div>
    </div>`;

  d.querySelector('.dr-close').addEventListener('click', closeDrawer);
  d.querySelectorAll('[data-status]').forEach((b) =>
    b.addEventListener('click', () => update(ref, { status: b.dataset.status })));
  d.querySelector('#save-notes').addEventListener('click', () =>
    update(ref, { notes: d.querySelector('#notes').value }));

  d.querySelector('#decline-btn')?.addEventListener('click', async () => {
    const status = d.querySelector('#decline-status');
    const reason = d.querySelector('#decline-reason').value.trim();
    const notify = d.querySelector('#decline-notify').checked;

    if (!confirm(notify
      ? 'Decline this application and email the candidate?'
      : 'Decline this application without telling the candidate?')) return;

    status.textContent = 'Declining…';
    try {
      const res = await fetch('/api/decline', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ ref, reason: reason || undefined, notify }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) { status.textContent = 'Failed: ' + (body.error || res.status); return; }

      status.textContent = body.notified
        ? 'Declined, candidate emailed.'
        : 'Declined. ' + (body.error || 'No email sent.');

      const rec = ALL.find((x) => x.ref === ref);
      if (rec) { rec.status = 'passed'; rec.declined_at = new Date().toISOString(); }
      render();
    } catch (err) {
      status.textContent = 'Failed: ' + err.message;
    }
  });

  d.querySelectorAll('[data-send]').forEach((b) =>
    b.addEventListener('click', () => introduce(ref, b.dataset.send, d)));

  document.body.append(scrim, d);
  document.addEventListener('keydown', escClose);
}

function escClose(e) { if (e.key === 'Escape') closeDrawer(); }
function closeDrawer() {
  document.querySelector('.scrim')?.remove();
  document.querySelector('.drawer')?.remove();
  document.removeEventListener('keydown', escClose);
}

/** Forward a candidate. Full details ask first — it is not undoable. */
async function introduce(ref, mode, drawer, override) {
  const status = drawer.querySelector('#send-status');

  if (mode === 'full' && !confirm(
    'Send this candidate\u2019s full contact details and background to the employer?\n\n' +
    'Once they have these they can hire directly. Only do this when a fee agreement is in place.')) return;

  status.textContent = 'Sending…';
  try {
    const res = await fetch('/api/forward', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ ref, mode, override: override || undefined }),
    });
    const body = await res.json().catch(() => ({}));

    // 409 means the gate stopped it: no fee agreement on file for this company.
    // That is the system working, not a fault — explain it, and offer the
    // override deliberately rather than leaving a dead end.
    if (res.status === 409 && body.needs_agreement) {
      status.innerHTML = esc(body.error) +
        '<br /><span class="send-warn">Nothing was sent. Add the agreement to the fee_agreements table, ' +
        'or override if you have terms recorded elsewhere.</span>';
      const again = document.createElement('button');
      again.type = 'button';
      again.className = 'btn danger';
      again.style.marginTop = '10px';
      again.textContent = 'Send anyway, no agreement';
      again.addEventListener('click', () => {
        if (confirm('Send with no fee agreement on file?\n\nYou will have no contractual claim if they hire this candidate.'))
          introduce(ref, mode, drawer, true);
      });
      status.append(again);
      return;
    }

    if (!res.ok) { status.textContent = 'Failed: ' + (body.error || res.status); return; }

    status.textContent = (mode === 'full' ? 'Full details sent just now' : 'Teaser sent just now') +
      (body.to ? ' to ' + body.to : '') +
      (body.fee_percent ? ' \u00b7 ' + body.fee_percent + '% fee on file' : ' \u00b7 no agreement on file');

    const a = ALL.find((x) => x.ref === ref);
    if (a) a.sent_to_employer_at = new Date().toISOString();
    render();
  } catch (err) {
    status.textContent = 'Failed: ' + err.message;
  }
}

async function update(ref, patch) {
  const res = await fetch('/api/applications', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ ref, ...patch }),
  });
  if (!res.ok) return;
  const a = ALL.find((x) => x.ref === ref);
  if (a) Object.assign(a, patch);
  render();
  if (patch.status) closeDrawer(); else openDrawer(ref);
}

/* Already signed in this tab? Skip the gate. */
if (ADMIN_KEY) {
  fetch('/api/applications', { headers: authHeaders() })
    .then((r) => { if (r.ok) { $('gate').hidden = true; $('app').hidden = false; load(); } })
    .catch(() => {});
}
</script>
